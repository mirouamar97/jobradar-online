name: Collect offers

# Serveur gratuit du site ET de l'appli Android : toutes les heures, lit des sources publiques (sites d'emploi, canaux
# Telegram publics, recherche web), note les offres (priorité événementiel / animation) et publie data/offers.json et
# data/status.json. Lecture seule : aucun compte, aucun mot de passe, aucun envoi.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Tests
        run: python -m pytest -q tools/tests

      - name: Collect
        run: python tools/collect.py

      - name: Commit data (only when it changed)
        id: commit
        run: |
          git config user.name "jobradar-collector"
          git config user.email "jobradar-collector@users.noreply.github.com"
          git add data/offers.json data/status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update offers [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow : on lance le déploiement du site explicitement.
      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
