name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le depot est PUBLIC : on refuse de publier si un secret ou un fichier personnel s'y trouve.
      - name: Secrets and personal files guard
        run: |
          set -e
          found=0
          if grep -rInE --exclude-dir=.git --exclude-dir=.github \
               -e '[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' -e 'GOCSPX-[A-Za-z0-9_-]{10,}' -e 'ghp_[A-Za-z0-9]{30,}' \
               -e 'AIza[0-9A-Za-z_-]{30,}' -e '"app_password"[[:space:]]*:[[:space:]]*"[^"]+"' . ; then found=1; fi
          for f in gmail_config.json token.json .env resume.pdf data/gmail_sent_history.json; do
            if [ -e "$f" ]; then echo "fichier personnel publie: $f"; found=1; fi
          done
          if [ "$found" = 1 ]; then echo "::error::secret ou fichier personnel detecte, publication annulee"; exit 1; fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
